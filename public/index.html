<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Basic Meta -->
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicon -->
  <link rel="icon" href="icon.ico" />

  <!-- Theme Color (matches dark space theme) -->
  <meta name="theme-color" content="#0b0f1a" />

  <!-- Title (Very important for SEO ranking) -->
  <title>
    Harshvardhan Patil | React Developer | Full Stack Web Developer Portfolio
  </title>

  <!-- Primary SEO Description (Human + Google friendly) -->
  <meta name="description"
    content="Harshvardhan Patil is a React and Full Stack Web Developer specializing in modern, responsive web applications using React.js, JavaScript, HTML5, CSS3, Node.js, MongoDB, and the MERN stack. Explore projects, skills, and contact details." />

  <!-- Keywords (kept natural, not spammy) -->
  <meta name="keywords"
    content="Harshvardhan Patil, React Developer, Full Stack Developer, Web Developer Portfolio, JavaScript Developer, MERN Stack Developer, Frontend Developer, React Projects, Node.js, MongoDB" />

  <!-- Author -->
  <meta name="author" content="Harshvardhan Patil" />

  <!-- Robots -->
  <meta name="robots" content="index, follow" />

  <!-- Canonical URL (IMPORTANT – replace with live URL later) -->
  <link rel="canonical" href="https://your-domain.com/" />

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

  <!-- Manifest -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Open Graph (LinkedIn / Facebook Preview) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Harshvardhan Patil | React & Full Stack Developer Portfolio" />
  <meta property="og:description"
    content="Explore modern React and Full Stack web development projects by Harshvardhan Patil." />
  <meta property="og:url" content="https://your-domain.com/" />
  <meta property="og:image" content="https://your-domain.com/preview.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Harshvardhan Patil | React Developer Portfolio" />
  <meta name="twitter:description"
    content="Modern portfolio showcasing React, JavaScript, and Full Stack development projects." />
  <meta name="twitter:image" content="https://your-domain.com/preview.png" />

  <!-- Structured Data for Google (Boosts search visibility) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Harshvardhan Patil",
    "url": "https://www.harshvardhanpatil.in/",
    "jobTitle": "React & Full Stack Web Developer",
    "knowsAbout": [
      "React.js",
      "JavaScript",
      "HTML5",
      "CSS3",
      "Node.js",
      "MongoDB",
      "MERN Stack",
      "Frontend Development",
      "Web Performance Optimization"
    ],
    "sameAs": [
      "https://github.com/harsh200539",
      "https://www.linkedin.com/in/hpatil1704"
    ]
  }
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
